<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chuva Cósmica</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-wrapper">
    <h1>☄️ Chuva Cósmica</h1>

    <div class="game-box">
      <canvas id="game" width="900" height="560"></canvas>
    </div>

    <div class="info">
      <span>Movimento: A/D ou ←/→</span>
      <span>Recorde: <b id="highScore">0</b></span>
    </div>

    <p class="tip">
      No celular, arraste o dedo para controlar a nave.
    </p>
  </main>

  <script src="game.js"></script>
</body>
</html>
